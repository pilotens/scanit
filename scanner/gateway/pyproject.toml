[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scanit-scanner-gateway"
version = "0.1.0"
description = "USB/Wi-Fi gateway for ScanIt physical RF scanners"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "websockets>=15,<17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanit_gateway*"]
