name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Capture type-check result
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat typecheck.log
          exit 0

      - name: Upload type-check diagnostics
        if: steps.typecheck.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 2

      - name: Fail on type errors
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1

      - name: Export web build
        run: npx expo export --platform web

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install --clean

  ios-native:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Generate native iOS project and install pods
        run: npx expo prebuild --platform ios --clean

      - name: Compile iOS simulator build
        id: iosbuild
        shell: bash
        run: |
          set -uo pipefail
          workspace=$(find ios -maxdepth 2 -name '*.xcworkspace' -print -quit)
          if [ -z "$workspace" ]; then
            echo 'No Xcode workspace was generated.' | tee xcodebuild.log
            echo 'exit_code=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scheme=$(basename "$workspace" .xcworkspace)
          set +e
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload iOS build diagnostics
        if: steps.iosbuild.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: xcodebuild.log
          if-no-files-found: error
          retention-days: 2

      - name: Fail on iOS build errors
        if: steps.iosbuild.outputs.exit_code != '0'
        run: exit 1
