[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scanit-wifi-csi-gateway"
version = "0.1.0"
description = "ESP32 CSI ingress and WCS1 WebSocket gateway for ScanIt"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5,<4",
  "websockets>=15,<17",
]

[project.scripts]
scanit-wifi-gateway = "scanit_wifi_gateway.__main__:main"
scanit-wifi-bench = "scanit_wifi_gateway.bench_readiness:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanit_wifi_gateway*"]
