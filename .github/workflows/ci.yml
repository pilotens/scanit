name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Capture scanner core tests
        id: scanner_tests
        shell: bash
        run: |
          set +e
          npm test > scanner-tests.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat scanner-tests.log
          exit 0

      - name: Upload scanner test diagnostics
        if: steps.scanner_tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: scanner-test-diagnostics
          path: scanner-tests.log
          if-no-files-found: error
          retention-days: 2

      - name: Fail on scanner test errors
        if: steps.scanner_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Capture type-check result
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat typecheck.log
          exit 0

      - name: Upload type-check diagnostics
        if: steps.typecheck.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 2

      - name: Fail on type errors
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1

      - name: Export web build
        run: npx expo export --platform web

  scanner-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install gateway
        run: python -m pip install --disable-pip-version-check -e scanner/gateway

      - name: Gateway protocol and fake-source tests
        run: python -m unittest discover -s scanner/gateway/tests -v

  wifi-csi-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Wi-Fi CSI gateway
        run: python -m pip install --disable-pip-version-check -e scanner/wifi-gateway

      - name: CSI0, WCS1, multi-link and control tests
        run: python -m unittest discover -s scanner/wifi-gateway/tests -v
